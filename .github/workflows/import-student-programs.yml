name: Import student study programs
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-student-programs.yml
      - scripts/import-student-programs.mjs
      - cloudflare/student-programs.enc.json
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cnr-tuition-database
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Import study programs
        run: node scripts/import-student-programs.mjs
        env:
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          ROSTER_CREDENTIAL_KEY: ${{ secrets.ROSTER_CREDENTIAL_KEY }}
