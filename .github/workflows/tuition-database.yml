name: Prepare tuition database

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tuition-database.yml
      - scripts/prepare-tuition-database.mjs
      - cloudflare/tuition-schema.sql
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cnr-tuition-database
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check access and initialize empty database
        env:
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: node scripts/prepare-tuition-database.mjs
