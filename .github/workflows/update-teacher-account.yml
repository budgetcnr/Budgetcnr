name: Update confirmed teacher account
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-teacher-account.yml
      - scripts/update-teacher-account.mjs
      - cloudflare/teacher-account-update.enc.json
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cnr-tuition-database
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update account and verify production login
        run: node scripts/update-teacher-account.mjs
        env:
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          ROSTER_CREDENTIAL_KEY: ${{ secrets.ROSTER_CREDENTIAL_KEY }}
