name: Verify tuition production
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - cloudflare/worker.mjs
      - cloudflare/tuition-api.mjs
      - tuition/**
      - scripts/verify-tuition-production.mjs
      - .github/workflows/verify-tuition.yml
permissions:
  contents: read
concurrency:
  group: cnr-tuition-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify real logins and permitted data
        run: node scripts/verify-tuition-production.mjs
        env:
          ROSTER_CREDENTIAL_KEY: ${{ secrets.ROSTER_CREDENTIAL_KEY }}
