name: Update Jiraphas advisor account
on:
  push:
    branches: [main]
    paths:
      - scripts/update-jiraphas-account.mjs
      - .github/workflows/update-jiraphas-account.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cnr-tuition-database
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update and verify teacher account
        run: node scripts/update-jiraphas-account.mjs
        env:
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          ROSTER_CREDENTIAL_KEY: ${{ secrets.ROSTER_CREDENTIAL_KEY }}
          JIRAPHAS_NEW_PASSWORD: ${{ secrets.JIRAPHAS_NEW_PASSWORD }}
